<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát bể nuôi thủy sản</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:16px;color:#0f172a}
  h1{font-size:1.3rem;text-align:center;margin:0 0 6px}
  #status{text-align:center;font-size:.85rem;margin-bottom:12px;color:#64748b}
  #status.ok{color:#16a34a} #status.err{color:#dc2626}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
  .card{background:#fff;border-radius:10px;padding:14px;min-width:220px;flex:1;max-width:340px;box-shadow:0 1px 4px #0002;text-align:center}
  .card h3{margin:0 0 6px;font-size:1rem;color:#475569}
  .value{font-size:2.2rem;font-weight:700}
  .chart{max-width:480px;min-width:280px}
  .state{margin:6px 0 12px;font-size:1rem}
  .state b{padding:2px 10px;border-radius:99px;background:#e2e8f0}
  .state b.on{background:#bbf7d0;color:#166534}
  .btns{display:flex;gap:8px;justify-content:center}
  button{flex:1;padding:12px 10px;border:0;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;color:#fff}
  .btn-on{background:#16a34a} .btn-off{background:#dc2626}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<h1>Giám sát môi trường bể nuôi thủy sản</h1>
<div id="status">Đang kết nối MQTT...</div>

<!-- Thẻ hiển thị dữ liệu (class) -->
<div class="row">
  <div class="card"><h3>Mực nước</h3><div class="value"><span class="level">--</span> m</div></div>
  <div class="card"><h3>Nhiệt độ bể</h3><div class="value"><span class="temp">--</span> °C</div></div>
</div>

<!-- Biểu đồ -->
<div class="row">
  <div class="card chart"><canvas id="cLevel"></canvas></div>
  <div class="card chart"><canvas id="cTemp"></canvas></div>
</div>

<!-- Điều khiển (manual) -->
<div class="row">
  <div class="card">
    <h3>Máy bơm nước vào</h3>
    <div class="state">Trạng thái: <b id="pumpSt">Tắt</b> · Công suất: <b id="pumpPct">0</b>%</div>
    <div class="btns">
      <button class="btn-on"  id="btnPumpOn">BẬT bơm</button>
      <button class="btn-off" id="btnPumpOff">TẮT bơm</button>
    </div>
  </div>
  <div class="card">
    <h3>Van thoát nước ra</h3>
    <div class="state">Trạng thái: <b id="valveSt">Đóng</b></div>
    <div class="btns">
      <button class="btn-on"  id="btnValveOn">MỞ van</button>
      <button class="btn-off" id="btnValveOff">ĐÓNG van</button>
    </div>
  </div>
</div>

<script>
const T = "nam_ptit/aqua/";
const $ = s => document.querySelector(s);
const statusEl = $("#status");

// ---------- Biểu đồ ----------
function mkChart(id, label, color){
  return new Chart($(id), {type:"line",
    data:{labels:[],datasets:[{label,data:[],borderColor:color,tension:.3,fill:false}]},
    options:{animation:false,scales:{x:{ticks:{maxTicksLimit:6}}}}});
}
const cLevel = mkChart("#cLevel","Mực nước (m)","#2563eb");
const cTemp  = mkChart("#cTemp","Nhiệt độ (°C)","#dc2626");
function push(chart, v){
  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(v);
  if(chart.data.labels.length > 30){chart.data.labels.shift();chart.data.datasets[0].data.shift();}
  chart.update();
}

// ---------- MQTT ----------
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
client.on("connect", () => {
  statusEl.textContent = "Đã kết nối MQTT broker";
  statusEl.className = "ok";
  client.subscribe(T + "#");
});
client.on("reconnect", () => { statusEl.textContent = "Đang kết nối lại..."; statusEl.className = ""; });
client.on("error", e => { statusEl.textContent = "Lỗi MQTT: " + e.message; statusEl.className = "err"; });

client.on("message", (topic, msg) => {
  const v = msg.toString();
  if(topic === T+"level"){ $(".level").textContent = v; push(cLevel, +v); }
  else if(topic === T+"temp"){ $(".temp").textContent = v; push(cTemp, +v); }
  else if(topic === T+"pump"){
    $("#pumpPct").textContent = v;
    const on = +v > 0;
    $("#pumpSt").textContent = on ? "Đang chạy" : "Tắt";
    $("#pumpSt").classList.toggle("on", on);
  }
  else if(topic === T+"valve"){
    const on = v === "1";
    $("#valveSt").textContent = on ? "Mở" : "Đóng";
    $("#valveSt").classList.toggle("on", on);
  }
});

// ---------- Gửi lệnh ----------
function send(dev, val){
  if(!client.connected){ statusEl.textContent = "Chưa kết nối MQTT, chưa gửi được lệnh"; statusEl.className = "err"; return; }
  client.publish(T + "cmd/" + dev, val);
}
$("#btnPumpOn").onclick   = () => send("pump", "1");
$("#btnPumpOff").onclick  = () => send("pump", "0");
$("#btnValveOn").onclick  = () => send("valve", "1");
$("#btnValveOff").onclick = () => send("valve", "0");
</script>
</body>
</html>
